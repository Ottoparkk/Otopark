project_id = "otopark"

# ---------------------------------------------------------------- functions

# Reads a plate for a signed-in operator. JWT stays ON — only authenticated,
# active staff may spend API tokens.
[functions.plaka-oku]
verify_jwt = true

# Camera hardware cannot present a JWT, so verification is OFF and a shared
# secret is the boundary instead (header, HTTP Basic, or URL path segment).
# Deploy with:  supabase functions deploy kamera-webhook --no-verify-jwt
[functions.kamera-webhook]
verify_jwt = false

# Driven by a database webhook, which also cannot present a JWT. Guarded by
# the x-push-secret header.
[functions.send-push]
verify_jwt = false

# Trades a short, single-use pairing code for a camera's own credential. The
# installer calls it before the bridge has any secret at all, so there is no
# JWT and no shared secret to present — the code IS the credential, and it
# expires in 15 minutes.
# Deploy with:  supabase functions deploy kamera-eslestir --no-verify-jwt
[functions.kamera-eslestir]
verify_jwt = false

# Nightly photo cleanup (043), called by the database through pg_net, which
# cannot present a JWT. Guarded by the x-temizlik-secret header.
# Deploy with:  supabase functions deploy foto-temizle --no-verify-jwt
[functions.foto-temizle]
verify_jwt = false

# Shared-terminal sign-in (084): name + 4-digit PIN. The terminal's own
# secret (64 hex, only its SHA-256 stored) is the credential, so there is no
# JWT to verify — the incoming worker is not signed in yet.
# Deploy with:  supabase functions deploy terminal-giris --no-verify-jwt
[functions.terminal-giris]
verify_jwt = false

# The Yönetici adds a worker with only a name + PIN (084). JWT stays ON and
# the function re-checks that the caller is an ACTIVE Yönetici.
[functions.personel-olustur]
verify_jwt = true
