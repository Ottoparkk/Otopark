<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14161A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Otopark" />
    <link rel="apple-touch-icon" href="/Otopark/icons/apple-touch-icon.png" />
    <title>Otopark</title>
    <script>
      // Applied before first paint so a dark-mode launch never flashes white.
      // Mirrors src/lib/theme.ts — keep the storage key in sync.
      (function () {
        try {
          if (localStorage.getItem('op-dark') === '1') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          /* storage-restricted context: light mode, app still works */
        }
      })()
    </script>
    <script>
      // GitHub Pages SPA fallback — restores the URL that 404.html encoded.
      // https://github.com/rafgraph/spa-github-pages
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
