<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Brand teal (--brand-from) for the splash, before any script runs.
         theme.ts replaces it with the live surface colour once the app boots,
         so these two are not meant to match. Keep in sync with the manifest in
         vite.config.ts and BG in scripts/generate-icons.mjs. -->
    <meta name="theme-color" content="#093140" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Otopark" />
    <link rel="apple-touch-icon" href="/Otopark/icons/apple-touch-icon.png" />
    <title>Otopark</title>
    <script>
      // Applied before first paint so the launch never flashes the wrong
      // colour. Dark is the DEFAULT, so the stored value is an opt-OUT: only
      // an explicit '0' turns it off, and a browser that refuses storage still
      // lands on dark rather than on the other theme from everyone else.
      // Mirrors src/lib/theme.ts — keep the key and the rule in sync.
      (function () {
        var dark = true
        try {
          dark = localStorage.getItem('op-dark') !== '0'
        } catch (e) {
          /* storage-restricted context: the default stands, app still works */
        }
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
    <script>
      // GitHub Pages SPA fallback — restores the URL that 404.html encoded.
      // https://github.com/rafgraph/spa-github-pages
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
